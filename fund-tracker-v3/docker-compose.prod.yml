services:
  mysql:
    image: mysql:8.0
    container_name: fund-tracker-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fund_tracker}
      MYSQL_USER: ${MYSQL_USER:-fund_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - fund_tracker_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fund-tracker-backend
    restart: always
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fund_tracker}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-fund_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://example.com}
    networks:
      - fund_tracker_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fund-tracker-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - fund_tracker_net

volumes:
  mysql_data:

networks:
  fund_tracker_net:
